stages:
  clean:
    cmd: python src/clean.py
    deps: [src/clean.py, data/batch_1.csv]
    params: [data.raw_path, data.clean_path]
    outs: [data/processed/clean.csv]
  split:
    cmd: python src/split.py
    deps: [src/split.py, data/processed/clean.csv]
    params: [data.test_size, data.seed]
    outs: [data/processed/train.csv, data/holdout/test.csv]