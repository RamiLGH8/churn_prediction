experiment:
  name: batch_1_experiment_1
  tracking_uri: https://dagshub.com/RamiLGH8/churn_prediction.mlflow
  primary_metric: f1
  cv_folds: 5
  random_state: 42
  n_jobs: -1
  number_of_features: [15, 20, all]
  thresholds: [0.35, 0.45, 0.50, 0.55, 0.65]

data:
  train_features_path: data/processed/batch_1_train.csv
  preprocessor_path: models/preprocessor.joblib
  target: Churn

models:
  logistic_regression:
    enabled: true
    fixed_params:
      max_iter: 2000
      solver: liblinear
      random_state: 42
    param_grid:
      C: [0.1, 1.0]
      class_weight: [null, balanced]

  random_forest:
    enabled: true
    fixed_params:
      n_jobs: -1
      random_state: 42
    param_grid:
      n_estimators: [300]
      max_depth: [null, 10]
      min_samples_leaf: [1, 3]
      class_weight: [balanced]

  gradient_boosting:
    enabled: true
    fixed_params:
      random_state: 42
    param_grid:
      n_estimators: [100, 200]
      learning_rate: [0.05, 0.1]
      max_depth: [2]
